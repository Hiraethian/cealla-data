     SHARED DATA (optional but recommended)
     Point this at your GitHub-hosted cealla-data.js via jsDelivr.
     Entries there that carry col/row are merged into HEXES below,
     so the map and the environment index share one data file.

<script>
(function () {
"use strict";

/* ============================================================
   1. CONFIG
   ============================================================ */
const CONFIG = {
  // 44 x 36 matches the map's 1.414 aspect almost exactly.
  // Change these and the grid rescales itself to the art.
  cols: 44,
  rows: 36,
  hexSize: 21,

  // Upload cealla-map.jpg to Squarespace and paste its URL here.
  baseImage: "https://static1.squarespace.com/static/673f340165a71b0fc817fb27/t/6a74aa281adc2239c6292295/1786030633171/Cealla+Map+HEX+%281%29.png",
  imageOpacity: 1,

  // Native pixel size of the base image. Used to convert each hex's
  // optional px/py (symbol position on the art) into beacon coordinates.
  imgW: 4961,
  imgH: 3508,

  linkBase: "/lore/",
  linkTarget: "_self",

  // "contain" shows the whole map with dark bands above and below.
  // "fill" zooms until the art covers the panel edge to edge; you pan
  // to reach the rest. Switch if the bands bother you.
  fitMode: "contain",

  gridOpacity: 0.22,   // hairline strength on unwritten regions
  litOpacity:  1,      // stroke strength on written regions
  litWeight:   2,      // stroke width on written regions
  litTint:     0.09    // luminous wash inside written regions; 0 = pure art
};

/* ============================================================
   2. KINDS — mirrors the map's own legend
   ============================================================ */
const KINDS = {
  city:       { label: "City",              beacon: "city"  },
  town:       { label: "Town",              beacon: "town"  },
  settlement: { label: "Township",          beacon: "town"  },
  fangyskyll: { label: "Fangyskyll",        beacon: "town"  },
  litri:      { label: "Litri Station",     beacon: "town"  },
  ruin:       { label: "Ruin",              beacon: null    },
  wild:       { label: "Wilderness",        beacon: null    },
  sea:        { label: "Open water",        beacon: null    }
};

/* ============================================================
   3. MASK — grid squares to leave blank, if you ever want to.
      Empty means the grid covers the entire map, furniture and all.
      Each entry would be [colFrom, rowFrom, colTo, rowTo], inclusive,
      e.g. [0, 5, 4, 7] to clear the CEALLA cartouche.
   ============================================================ */
const MASK = [];

/* ============================================================
   4. HEXES — the regions you've actually written.
      col/row counted from the top-left, 0-indexed.
      Anything omitted stays uncharted.

      NOTE: teasers below are placeholder copy written off the map
      itself, not your canon. Replace them.
   ============================================================ */
const HEXES = [

  /* ---------------------------------------------------------------
     Deliberately empty: every hex renders uncharted. Add entries here
     (col/row/kind/name/slug/threat/teaser) when a region is written
     and it lights up as before. Verified pixel coordinates for every
     named location's symbol live in cealla_marker_coords.js.

     Written hexes now render as a Daggerheart environment stat
     block. Field shape (everything below col/row/kind/name/slug is
     optional and skipped when absent):

     { col:20, row:13, kind:"city", name:"Example", slug:"example",
       tier: 1,
       envType: "Event",                     // Event / Exploration / Social / Traversal
       flavor: "One italic line of scene-setting.",
       impulses: "Impulse one, impulse two",
       difficulty: 11,
       adversaries: "Adversary A, Adversary B",
       features: [
         { name:"Feature Name", type:"Action",
           text:"Effect text. Inline <b>bold</b> is allowed." },
         { name:"Second Feature", type:"Passive",
           text:"More effect text." }
       ] },
     --------------------------------------------------------------- */

];

/* Merge shared-file entries (window.CEALLA_DATA) into HEXES.
   Only entries with col/row become hexes; inline entries above win
   on collision so local overrides stay possible. Shared linkBase /
   mapPage, when present, override CONFIG. */
if (window.CEALLA_DATA && Array.isArray(window.CEALLA_DATA.entries)) {
  if (window.CEALLA_DATA.linkBase) CONFIG.linkBase = window.CEALLA_DATA.linkBase;
  const taken = {};
  HEXES.forEach(function (h) { taken[h.col + ":" + h.row] = true; });
  window.CEALLA_DATA.entries.forEach(function (e) {
    if (e.col == null || e.row == null) return;
    if (taken[e.col + ":" + e.row]) return;
    taken[e.col + ":" + e.row] = true;
    HEXES.push(e);
  });
}


/* ============================================================
   Machinery below. You shouldn't need to edit it.
   ============================================================ */

const S = CONFIG.hexSize;
const SQ3 = Math.sqrt(3);

function toAxial(col, row) { return { q: col - ((row - (row & 1)) / 2), r: row }; }
function center(q, r) { return { x: S * SQ3 * (q + r / 2), y: S * 1.5 * r }; }

function corners(cx, cy) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    pts.push([-(cy + S * Math.sin(a)), cx + S * Math.cos(a)]);
  }
  return pts;
}

const label = (c, r) => String(c).padStart(2, "0") + "." + String(r).padStart(2, "0");

const masked = (c, r) => MASK.some(m => c >= m[0] && c <= m[2] && r >= m[1] && r <= m[3]);

const authored = new Map();
HEXES.forEach(h => authored.set(h.col + ":" + h.row, h));

const grid = [];
for (let row = 0; row < CONFIG.rows; row++) {
  for (let col = 0; col < CONFIG.cols; col++) {
    if (masked(col, row)) continue;
    const found = authored.get(col + ":" + row);
    grid.push(found
      ? Object.assign({ charted: true }, found)
      : { col, row, charted: false, name: "Uncharted", kind: null });
  }
}

/* ---------- map ---------- */
const map = L.map("svyMap", {
  crs: L.CRS.Simple,
  minZoom: -2.5, maxZoom: 1.5,
  zoomSnap: 0.25,
  attributionControl: false,
  zoomControl: true
});
map.zoomControl.setPosition("bottomright");

/* image extent is derived from the full grid, mask included, so the
   art always lines up whatever you blank out */
const gw = S * SQ3 * (CONFIG.cols + 0.5);
const gh = S * (1.5 * CONFIG.rows + 0.5);
const x0 = -S * SQ3 * 0.5, y0 = -S;
const bounds = L.latLngBounds([-(y0 + gh), x0], [-y0, x0 + gw]);

if (CONFIG.baseImage) {
  L.imageOverlay(CONFIG.baseImage, bounds, { opacity: CONFIG.imageOpacity }).addTo(map);
}
function fitMap() {
  if (CONFIG.fitMode === "fill") {
    map.setView(bounds.getCenter(), map.getBoundsZoom(bounds, true));
  } else {
    map.fitBounds(bounds);
  }
}
fitMap();
map.setMaxBounds(bounds.pad(0.25));

/* keep the framing right when the window changes shape */
let fitTimer;
window.addEventListener("resize", function () {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(function () { map.invalidateSize(); fitMap(); }, 180);
});

/* ---------- draw ---------- */
/* At this grid density the unlit hexes go on a canvas renderer, which
   draws ~1,500 polygons without breaking a sweat. Written hexes go on a
   separate SVG pane above it, because the permanent glow is a CSS filter
   and CSS filters can't touch canvas. Best of both. */
const gridRenderer = L.canvas({ padding: 0.6 });
map.createPane("svyLit");
map.getPane("svyLit").style.zIndex = 450;

const hexLayer = L.layerGroup().addTo(map);
const beaconLayer = L.layerGroup().addTo(map);
const shapes = new Map();
let writtenOnly = false, gridOn = true;

function style(h) {
  if (h.charted) {
    return {
      color: "#5fdce8",
      weight: CONFIG.litWeight,
      opacity: CONFIG.litOpacity,
      fillColor: "#c9f6fa",
      fillOpacity: CONFIG.litTint
    };
  }
  return {
    color: "#5fdce8",
    weight: 1,
    opacity: CONFIG.gridOpacity,
    fillColor: "#5fdce8",
    fillOpacity: 0
  };
}

function card(h) {
  const k = KINDS[h.kind];
  if (!h.charted) {
    return '<div class="svy-card">' +
      '<div class="svy-card-meta"><span>Region ' + label(h.col, h.row) + '</span><span>No data</span></div>' +
      '<h4>Uncharted</h4>' +
      '<p>No survey has been written for this region yet.</p>' +
      '<div class="svy-locked">Survey pending</div></div>';
  }
  /* Written hexes render as a Daggerheart environment stat block.
     All DH fields are optional; anything omitted is skipped. */
  let out = '<div class="svy-card">' +
    '<div class="svy-card-meta"><span>Region ' + label(h.col, h.row) + '</span>' +
      '<span>' + (k ? k.label : 'Field record') + '</span></div>' +
    '<div class="svy-dh-title">' + h.name + '</div>';
  if (h.tier != null || h.envType)
    out += '<div class="svy-dh-tier">' +
      (h.tier != null ? 'Tier ' + h.tier + ' ' : '') + (h.envType || '') + '</div>';
  if (h.flavor) out += '<p class="svy-dh-flavor">' + h.flavor + '</p>';
  if (h.impulses) out += '<div class="svy-dh-impulses"><b>Impulses:</b> ' + h.impulses + '</div>';
  if (h.difficulty != null || h.adversaries) {
    out += '<div class="svy-dh-box">';
    if (h.difficulty != null) out += '<div><b>Difficulty:</b> ' + h.difficulty + '</div>';
    if (h.adversaries) out += '<div><b>Potential Adversaries:</b> ' + h.adversaries + '</div>';
    out += '</div>';
  }
  if (h.features && h.features.length) {
    out += '<div class="svy-dh-feats">Features</div>';
    h.features.forEach(function (f) {
      out += '<p class="svy-dh-feat"><b>' + f.name +
        (f.type ? ' - <span class="svy-dh-ftype">' + f.type + '</span>' : '') +
        ':</b> ' + f.text + '</p>';
    });
  }
  if (h.teaser && !h.flavor) out += '<p class="svy-dh-flavor">' + h.teaser + '</p>';
  if (h.threat) out += '<div class="svy-card-threat">Threat &nbsp;<b>' + h.threat + '</b></div>';
  out += '<a class="svy-go" href="' + CONFIG.linkBase + h.slug + '" target="' + CONFIG.linkTarget + '">' +
    'Read the full entry</a></div>';
  return out;
}

grid.forEach(h => {
  const a = toAxial(h.col, h.row);
  const c = center(a.q, a.r);
  const opts = style(h);
  if (h.charted) {
    opts.className = "svy-lit";
    opts.pane = "svyLit";
  } else {
    opts.renderer = gridRenderer;
  }
  const poly = L.polygon(corners(c.x, c.y), opts);

  poly.on("mouseover", function () {
    this.setStyle({ color: "#5fdce8", weight: 2, opacity: 1, dashArray: null });
    this.bringToFront();
  });
  poly.on("mouseout", function () { this.setStyle(style(h)); });

  poly.bindPopup(card(h), { closeButton: true, autoPanPadding: [30, 30] });
  poly.addTo(hexLayer);
  shapes.set(h.col + ":" + h.row, { hex: h, poly: poly, latlng: L.latLng(-c.y, c.x) });

  /* the artwork already carries the place names — beacons only, no labels */
  const beacon = h.charted && KINDS[h.kind] ? KINDS[h.kind].beacon : null;
  if (beacon) {
    /* px/py pin the beacon to the symbol on the art; otherwise hex center */
    let bx = c.x, by = c.y;
    if (h.px != null && h.py != null && CONFIG.imgW && CONFIG.imgH) {
      bx = x0 + (h.px / CONFIG.imgW) * gw;
      by = y0 + (h.py / CONFIG.imgH) * gh;
    }
    L.marker([-by, bx], {
      interactive: false,
      icon: L.divIcon({
        className: "",
        html: '<div class="svy-beacon' + (beacon === "town" ? " is-town" : "") + '"><i></i></div>',
        iconSize: [0, 0]
      })
    }).addTo(beaconLayer);
  }
});

/* Toggling visibility by container beats restyling 1,584 polygons one at
   a time — each canvas setStyle would force a full redraw. */
function applyVisibility() {
  const gridEl = gridRenderer._container;
  const litEl = map.getPane("svyLit");
  if (gridEl) gridEl.style.display = (gridOn && !writtenOnly) ? "" : "none";
  if (litEl) litEl.style.display = gridOn ? "" : "none";
  if (gridOn) beaconLayer.addTo(map); else map.removeLayer(beaconLayer);
}

/* ---------- panel ---------- */
const done = HEXES.length, total = grid.length;
document.getElementById("svyDone").textContent = done;
document.getElementById("svyTotal").textContent = total;
document.getElementById("svyHeadDone").textContent = done;
document.getElementById("svyHeadTotal").textContent = total;
document.getElementById("svyBar").style.width = Math.round(done / total * 100) + "%";

/* ---------- panel toggle ---------- */
const root = document.getElementById("svyRoot");
const tab = document.getElementById("svyTab");

tab.addEventListener("click", function () {
  const collapsed = root.classList.toggle("is-collapsed");
  tab.setAttribute("aria-expanded", String(!collapsed));
  if (!collapsed) setTimeout(() => document.getElementById("svySearch").focus(), 320);
});

/* the map has to be told its box changed, both during and after the slide */
let slideTimer;
root.addEventListener("transitionstart", function (e) {
  if (e.target !== root) return;
  clearInterval(slideTimer);
  slideTimer = setInterval(() => map.invalidateSize({ animate: false }), 40);
});
root.addEventListener("transitionend", function (e) {
  if (e.target !== root) return;
  clearInterval(slideTimer);
  map.invalidateSize({ animate: false });
  fitMap();
});

document.getElementById("svyKey").innerHTML =
  '<div class="svy-key is-lit"><i></i>Written &mdash; entry available</div>' +
  '<div class="svy-key is-quiet"><i></i>Not yet written</div>';

const results = document.getElementById("svyResults");

function renderList(q) {
  const term = (q || "").trim().toLowerCase();
  const pool = HEXES.filter(h => !term || h.name.toLowerCase().indexOf(term) > -1);

  if (!pool.length) {
    results.innerHTML = term
      ? '<p class="svy-eyebrow">No match</p>' +
        '<p class="svy-empty">Nothing written under that name yet.</p>'
      : '<p class="svy-eyebrow">Written regions</p>' +
        '<p class="svy-empty">None yet. Add entries to the HEXES array and they appear here.</p>';
    return;
  }

  results.innerHTML = '<p class="svy-eyebrow">' +
    (term ? pool.length + " match" + (pool.length > 1 ? "es" : "") : "Written regions") + '</p>' +
    pool.map(h =>
      '<button class="svy-hit" data-k="' + h.col + ':' + h.row + '">' + h.name +
      '<u>' + label(h.col, h.row) + ' &middot; ' + (KINDS[h.kind] ? KINDS[h.kind].label : "region") + '</u></button>'
    ).join("");
}

results.addEventListener("click", function (e) {
  const btn = e.target.closest(".svy-hit");
  if (!btn) return;
  const entry = shapes.get(btn.getAttribute("data-k"));
  if (!entry) return;
  map.setView(entry.latlng, Math.max(map.getZoom(), -0.25), { animate: true });
  entry.poly.openPopup();
});

document.getElementById("svySearch").addEventListener("input", e => renderList(e.target.value));
document.getElementById("svyWritten").addEventListener("change", e => { writtenOnly = e.target.checked; applyVisibility(); });
document.getElementById("svyNoGrid").addEventListener("change", e => { gridOn = !e.target.checked; applyVisibility(); });

renderList("");
})();
</script>
